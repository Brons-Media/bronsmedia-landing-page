name: Deploy med Symlink till Inleed

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installera och bygg
        run: |
          npm install
          npm run build

      - name: Ladda upp nya versionen via SFTP/Rsync
        uses: easingthemes/ssh-deploy@v5.0.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BM_SSH_PRIVATE_KEY }}
          ARGS: "-rltgoDz --delete"
          REMOTE_HOST: ${{ secrets.BM_SSH_HOST }}
          REMOTE_USER: ${{ secrets.BM_SSH_USER }}
          # Laddar upp till: kampanj/releases/reponame/commit-sha
          TARGET: "/home/bronsmedia/domains/bronsmedia.se/public_html/kampanj/releases/${{ github.event.repository.name }}/${{ github.sha }}"
          SOURCE: "dist/"

      - name: Peka om symlänken på Inleed
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BM_SSH_HOST }}
          username: ${{ secrets.BM_SSH_USER }}
          key: ${{ secrets.BM_SSH_PRIVATE_KEY }}
          script: |
            BASE_DIR="/home/bronsmedia/domains/bronsmedia.se/public_html/kampanj"
            REPO_NAME="${{ github.event.repository.name }}"
            
            RELEASE_DIR="$BASE_DIR/releases/$REPO_NAME/${{ github.sha }}"
            SYMLINK="$BASE_DIR/$REPO_NAME"

            # 1. Skapa symlänken direkt i /kampanj/ mappen (kampanj/reponame -> releases/reponame/sha)
            ln -sfn $RELEASE_DIR $SYMLINK

            # 2. Städa gamla versioner (sparar de 5 senaste)
            cd $BASE_DIR/releases/$REPO_NAME && ls -t | tail -n +6 | xargs -r rm -rf
